version: '3.8'

# Production Docker Compose for Finance Tracker
# Deploy with: docker-compose up -d
# View logs: docker-compose logs -f [service-name]
# Stop all: docker-compose down

services:
  # MySQL Database (Port 3306)
  mysql:
    image: mysql:8.0
    container_name: finance-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-personal_finance_tracker}
      MYSQL_USER: ${DB_USER:-finance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-finance_password}
      TZ: 'UTC'
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - finance-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Backend Express API (Port 5001)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: finance-backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-finance_user}
      DB_PASSWORD: ${DB_PASSWORD:-finance_password}
      DB_NAME: ${DB_NAME:-personal_finance_tracker}
      DB_PORT: 3306
    ports:
      - "5001:5001"
    depends_on:
      - mysql
    networks:
      - finance-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M

  # Frontend React App (Port 5175)
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: finance-frontend
    restart: always
    ports:
      - "5175:5175"
    depends_on:
      - backend
    networks:
      - finance-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M

# Network untuk komunikasi antar services
networks:
  finance-network:
    driver: bridge

# Volume untuk persist database
volumes:
  mysql_data:
    driver: local
